[workspace]
members = [
  "apps/mac-cleaner-cli",
  "apps/mac-cleaner-desktop/src-tauri",
  "crates/cleaner-domain",
  "crates/cleaner-fs",
  "crates/cleaner-policy",
  "crates/cleaner-service",
  "crates/cleaner-store",
  "crates/cleaner-system-macos",
]
resolver = "2"

[workspace.package]
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.96"
authors = ["Mac Cleaner contributors"]
license = "MIT"
repository = "https://github.com/da0101/mac-cleaner"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
directories = "6.0"
fs2 = "0.4"
libc = "0.2"
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.39"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
missing_errors_doc = "allow"
