name: Rust replacement

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Lint every Rust target
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --target ${{ matrix.target }}
      - name: Build native binaries
        run: cargo build --workspace --target ${{ matrix.target }}
      - name: Build native SwiftUI application
        run: |
          xcodebuild \
            -project apps/mac-cleaner-macos/MacCleanerNative.xcodeproj \
            -scheme MacCleanerNative \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/mac-cleaner-native" \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES \
            build
      - name: Run native Swift tests
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          xcodebuild test \
            -project apps/mac-cleaner-macos/MacCleanerNative.xcodeproj \
            -scheme MacCleanerNative \
            -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/mac-cleaner-native-tests" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES
